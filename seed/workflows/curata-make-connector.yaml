title: Skill - Make Connector
subtitle: Map any vendor API to kazam components via an OpenAPI spec, producing a .map.yaml connector file and sync script.
shell: standard
skill:
  trigger: make connector, map api, create connector, new connector, api mapping, map this api
  setup:
  - key: openapi_spec
    ask: Path to the vendor's OpenAPI/Swagger spec file (.json or .yaml)?
  - key: api_keys_env
    ask: Path to the .env file with API keys for this vendor, or name the env vars to set?
  requires:
  - write_page
  - get_component_reference
dashboard:
  prompt: |
    Run the Make Connector skill. I need the path to an OpenAPI spec and
    API credentials. I'll map the API to kazam components, build a showcase,
    iterate with you, then ship a .map.yaml connector and sync script.
  description: Map a vendor API to kazam components and ship a connector
components:
- type: section
  eyebrow: Overview
  heading: What this skill does
  components:
  - type: callout
    variant: info
    title: From OpenAPI spec to live connector in one session
    body: |
      Reads a vendor's OpenAPI spec, discovers who reads the data and what they care about, pulls sample records from the real API, brainstorms metrics per persona, maps each metric to kazam components, builds a showcase page with real data so a human can see what they're getting, iterates until the human is happy, then writes the production .map.yaml connector file and a sync script that runs on cron.

      The output is a kazam connect connector: a declarative .map.yaml that `kazam connect run <vendor>` executes to pull, transform, aggregate, and output data to curata or the terminal.
  - type: definition_list
    items:
    - term: Trigger
      definition: Manual - run once per vendor API you want to connect. The connector it produces runs on cron after that.
    - term: Data Sources
      definition: The vendor's OpenAPI spec (local file), live API calls for sample data, and the kazam component reference for mapping decisions.
    - term: Output
      definition: A .map.yaml connector file, a sync script, a .env.example, and a showcase page on curata showing what the connector produces.
- type: section
  eyebrow: Setup
  heading: What you need before running
  components:
  - type: callout
    variant: warn
    title: Two things required
    body: |
      - An OpenAPI/Swagger spec file for the vendor API (.json or .yaml)
      - API credentials that can read the data you want to map (in a .env file or as env vars)

      The spec doesn't need to be perfect - partial specs work, the skill will discover what's available from sample data. But without a spec, the skill can't auto-discover endpoints and schemas.
  - type: definition_list
    items:
    - term: OpenAPI spec
      definition: Path to the vendor's OpenAPI/Swagger spec file. Accepts v2 (Swagger) or v3 (OpenAPI). JSON or YAML.
    - term: API credentials
      definition: Path to a .env file with the API key/token, or name the env vars so the skill can set up the .env.example.
- type: section
  eyebrow: Prerequisites
  heading: Before you run this skill
  components:
  - type: callout
    variant: warn
    title: Required tools
    body: |
      - kazam installed (`kazam connect run` must work) - see [github.com/tdiderich/kazam](https://github.com/tdiderich/kazam)
      - Network access to the vendor API (the skill pulls 50-100 sample records)
      - A curata instance if you want the showcase page and final output written there (otherwise terminal/file output works)

      The connector file format is documented in the kazam repo under `connectors/CONNECT_SPEC.md`.
- type: section
  eyebrow: Concepts
  heading: How mapping works
  components:
  - type: callout
    variant: info
    title: Two-layer mapping
    body: |
      The .map.yaml file has two layers:

      **Layer 1 - Shapes** (exploration): API schema shape + aggregation pseudo-code + 3-4 component candidates. This is what the brainstorm phase produces.

      **Layer 2 - Sections** (production): one decided component per shape with rendering config. This is what ships after the human picks winners from the showcase.

      Aggregation uses a constrained verb set (not SQL): expand, clean, bucket, tally, derive, compare, rank, take, filter, distinct. This keeps mappings readable and portable.
  - type: markdown
    body: |
      **Persona-driven design**: every shape ties to a persona - the person who asks the question this metric answers. Typical personas: board (high-level program health), CISO (asset risk posture), remediator (what to fix first). The skill discovers your personas before brainstorming metrics.
- type: section
  eyebrow: Flow
  heading: Validated Flow
  components:
  - type: markdown
    body: |
      Before executing the fence, fetch `GET /api/docs/agl` for execution semantics.

      ```agl
      spec ApiComponentMapping {
        in: openapi_spec: str, api_keys_env: str
        out: mapping_shipped: bool
        description: "Map any OpenAPI spec to kazam components: ingest spec, discover personas, brainstorm metrics, build showcase, iterate, write mapping file, generate sync script, ship."
        requires: write_page, get_component_reference

        flow {
          state INGEST_SPEC -> call(Read, "parse openapi_spec: extract endpoints, schemas, auth, pagination, enums, required fields") -> next
          state DISCOVER_PERSONAS -> evaluate("ask user: who reads this data and what question does each persona ask? capture 2-4 personas") -> next
          state SAMPLE_DATA -> call(Bash, "fetch 50-100 records from API using api_keys_env, store in scratchpad") -> next
          state BRAINSTORM_METRICS -> fan(PersonaBrainstorm, personas) -> next
          state MERGE_CANDIDATES -> evaluate("dedupe suggestions, match to kazam components via get_component_reference, cap 3-4 per shape, write draft mapping") -> next
          state REVIEW_CANDIDATES -> gate(human_approval) -> branch CANDIDATE_VERDICT

          branch CANDIDATE_VERDICT {
            if approved -> BUILD_SHOWCASE
            if add_more -> BRAINSTORM_METRICS
            if cut_shapes -> MERGE_CANDIDATES
          }

          state BUILD_SHOWCASE -> call(write_page, "showcase page YAML from candidates + real data, one section per shape, plan- prefix slug") -> next
          state REVIEW_SHOWCASE -> gate(human_approval) -> branch SHOWCASE_VERDICT

          branch SHOWCASE_VERDICT {
            if needs_changes -> BUILD_SHOWCASE
            if approved -> FINALIZE_MAPPING
          }

          state FINALIZE_MAPPING -> call(Write, "write .map.yaml with both layers: shapes + decided sections") -> next
          state GENERATE_SCRIPTS -> call(Write, "sync script + .env.example: pull, aggregate, build sections, write to curata") -> next
          state REVIEW_SCRIPTS -> gate(human_approval) -> branch SCRIPT_VERDICT

          branch SCRIPT_VERDICT {
            if approved -> DRY_RUN
            if fix_needed -> GENERATE_SCRIPTS
          }

          state DRY_RUN -> call(Bash, "run sync script with --dry-run, output page YAML to stdout") -> next
          state REVIEW_DRY_RUN -> gate(human_approval) -> branch DRY_RUN_VERDICT

          branch DRY_RUN_VERDICT {
            if looks_good -> SHIP
            if fix_needed -> GENERATE_SCRIPTS
          }

          state SHIP -> call(Bash, "run sync script for real, output cron line") -> TERMINATE("Mapping shipped. Sync script + .env.example + cron line ready.")
        }
      }
      ```
- type: section
  eyebrow: Reference
  heading: Aggregate verb set
  components:
  - type: definition_list
    items:
    - term: "expand .path[]"
      definition: Flatten a nested array into rows
    - term: "clean .field: <rule>"
      definition: "Normalize a field value (strip prefix, strip suffix, etc.)"
    - term: "bucket by .field1, .field2"
      definition: Group rows by one or more fields
    - term: "tally <condition> as <name>"
      definition: Count rows matching a condition within each bucket
    - term: "derive <name>: <expression>"
      definition: Compute a new field from existing ones
    - term: "compare <a> vs <b> -> <name>"
      definition: Compute a ratio or delta between two fields
    - term: "rank by <field> <direction>"
      definition: Sort rows
    - term: "take <n>"
      definition: Limit results to top n
    - term: "filter where <condition>"
      definition: Remove rows not matching a condition
    - term: "distinct .field"
      definition: Unique values of a field
- type: section
  eyebrow: Key Rules
  heading: Rules for this skill
  components:
  - type: callout
    variant: info
    title: Human picks winners, not the agent
    body: |
      The showcase page shows all candidates with real data so the human can see what works. The agent proposes, the human decides. Never skip the showcase review gate - a connector that ships metrics nobody asked for is worse than no connector.

      Every shape ties to a persona and a question. If a metric doesn't answer someone's question, it doesn't belong in the mapping. Three good shapes beat six mediocre ones.

      The aggregate pseudo-code uses only the constrained verb set. No SQL, no arbitrary code in the mapping file. The sync script translates the pseudo-code into executable Python.
pack:
  targets:
  - claude
  - cursor
