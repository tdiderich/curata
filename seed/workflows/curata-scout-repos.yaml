title: "Skill - Scout Repos"
subtitle: Read the repos this agent can access and propose the knowledge worth sharing across the org as reviewable curata pages.
shell: standard
skill:
  trigger: "scout repos for curata, pull knowledge out of our repos, seed curata from what we already have written down"
  setup:
    - key: repo_scope
      ask: "Which repos should this skill read? Name them, or say 'everything this agent has access to'."
    - key: capture_folder
      ask: "Which folder should proposed pages land in, if you want a default rather than picking each time? Optional."
dashboard:
  prompt: |
    Run the Scout Repos skill. Tell me which repos to read (or say all of
    them), then follow the flow on this page to propose shareable pages.
  description: "Turn what your repos already know into reviewable pages"
components:
  - type: section
    eyebrow: Overview
    heading: What this skill does
    components:
      - type: callout
        variant: info
        title: Your repos already have the answers written down
        body: |
          Reads READMEs, docs/ directories, runbooks, CLAUDE.md and AGENTS.md files, architecture decision records, and incident notes across the repos this agent can access. Splits what it finds into company-shareable knowledge and team-local detail, then runs the same capture choreography a human uses when pasting in a thread: dedup check, checklist, then create or patch. Nothing gets written as trusted. A human reviews every candidate.
      - type: definition_list
        items:
          - term: Trigger
            definition: Manual - run once against a fresh brain, then re-run whenever repos gain new docs worth surfacing.
          - term: Data Sources
            definition: Whatever repos this agent has read access to - README files, docs/ dirs, runbooks, CLAUDE.md/AGENTS.md, ADRs, incident and postmortem notes.
          - term: Output
            definition: One untrusted page per shareable candidate, created new or patched onto a near-duplicate, tagged with at least one concept, plus a summary of what was found, proposed, merged, and skipped.

  - type: section
    eyebrow: Setup
    heading: Optional Defaults
    components:
      - type: callout
        variant: warn
        title: Nothing required, two things worth deciding once
        body: |
          This skill runs on curata plus whatever repos the agent can already read. No other MCP tool is required. The only things worth fixing per org are which repos count and where proposed pages land.
      - type: definition_list
        items:
          - term: Repo scope
            definition: Which repos should this skill read? Name them, or say "everything this agent has access to."
          - term: Capture folder
            definition: Which folder should proposed pages land in, if you want a default rather than picking each time? Optional.

  - type: section
    eyebrow: Prerequisites
    heading: Before you run this skill
    components:
      - type: callout
        variant: warn
        title: Required inputs
        body: |
          - Read access to at least one repo
          - Nothing else - no external MCP tool beyond curata itself is required

  - type: section
    eyebrow: Flow
    heading: Validated Flow
    components:
      - type: markdown
        body: |
          Before executing the fence, fetch `GET /api/docs/agl` for execution semantics.

          ```agl
          spec ScoutRepos {
            in: repos: str
            out: candidates_summarized: bool
            description: "Read the org's repos and propose shareable knowledge as reviewable curata pages, one capture per candidate."
            requires: capture_thread, create_page, patch_page

            flow {
              state READ_REPOS -> call(read_files, "READMEs, docs/ dirs, runbooks, CLAUDE.md/AGENTS.md, ADRs, incident notes across the named repos") -> next
              state CLASSIFY -> evaluate(each_finding vs company_shareable_or_team_local) -> next
              state RUN_CAPTURE -> call(capture_thread, "the next shareable candidate's content, source repo and file path, page_type if not the default") -> next
              state REVIEW_CANDIDATE -> gate(human_approval) -> next
              state WRITE_CANDIDATE -> call(create_page, "capture_token plus dedup_ack: new, or patch_page the matched slug instead if the human picked an existing candidate") -> next
              state MORE_CANDIDATES -> evaluate(remaining_shareable_candidates vs none) -> branch

              branch MORE_CANDIDATES {
                if candidates_remain -> RUN_CAPTURE
                if none_remain -> SUMMARIZE
              }

              state SUMMARIZE -> evaluate(found_vs_proposed_vs_merged_vs_skipped) -> TERMINATE("Repos scouted, candidates proposed for review")
            }
          }
          ```

  - type: section
    eyebrow: Key Rules
    heading: Rules for this skill
    components:
      - type: callout
        variant: info
        title: Team-local stays local
        body: |
          A build quirk that only makes sense inside one repo is not a curata page. Only company-shareable knowledge gets proposed: how the team works, architecture decisions, on-call lore, FAQ-shaped answers anyone in the org would ask. Everything else counts as skipped, not silently dropped.

          Never skip capture_thread. Every candidate lands untrusted, tagged with at least one concept. End the run with an exact count: candidates found, proposed as new pages, merged into existing pages, skipped as team-local.
