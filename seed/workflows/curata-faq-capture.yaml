title: Skill - FAQ Capture
subtitle: Turn a pasted thread or transcript into a reviewable curata page, deduped and checklist-complete before anything
  gets written.
shell: standard
skill:
  trigger: capture this, add to the brain, add to the faq, save this thread
  setup:
  - key: capture_folder
    ask: Which folder should captured pages land in, if you want a default rather than picking each time? Optional - capture_thread
      and create_page both work without one.
  - key: capture_page_type
    ask: Is captured-qa (the default) the right shape for what you're capturing, or do you have a different page type in mind?
  requires:
  - capture_thread
  - create_page
  - patch_page
dashboard:
  prompt: |
    Run the FAQ Capture skill. Paste the thread or transcript you want captured
    (or a link, if I have a tool that can fetch it), then follow the flow on
    this page.
  description: Turn a pasted thread into a reviewable, deduped page
components:
- type: section
  eyebrow: Overview
  heading: What this skill does
  components:
  - type: callout
    variant: info
    title: Stop losing answers to chat history
    body: |
      Takes a thread, transcript, or conversation you paste in, checks it against existing pages so the same answer never gets captured twice, fills a rule-derived checklist for the target page type, and creates or updates a page, never both. Every capture keeps its source and who said it.
  - type: definition_list
    items:
    - term: Trigger
      definition: Manual - run whenever a thread is worth keeping. No scan, no schedule; you decide what gets captured.
    - term: Data Sources
      definition: Whatever you paste. A link works too, if you already have a tool connected that can fetch it - otherwise
        paste the text.
    - term: Output
      definition: One page (captured-qa by default), created new or patched onto an existing near-duplicate, tagged with at
        least one concept.
- type: section
  eyebrow: Setup
  heading: Optional Defaults
  components:
  - type: callout
    variant: warn
    title: Nothing required, two things worth deciding once
    body: |
      This skill has no external tool dependency, it runs on curata alone. The only things worth fixing per org are where captures land and what shape they take by default.
  - type: definition_list
    items:
    - term: Capture folder
      definition: Which folder should captured pages land in, if you want a default rather than picking each time? Optional.
    - term: Page type
      definition: Is captured-qa (the default) the right shape for what you're capturing, or do you have a different page
        type in mind?
- type: section
  eyebrow: Prerequisites
  heading: Before you run this skill
  components:
  - type: callout
    variant: warn
    title: Required inputs
    body: |
      - The thread or transcript itself, pasted in
      - Nothing else - no external MCP tool is required to run this skill
- type: section
  eyebrow: Flow
  heading: Validated Flow
  components:
  - type: markdown
    body: |
      Before executing the fence, fetch `GET /api/docs/agl` for execution semantics.

      ```agl
      spec CaptureThread {
        in: content: str
        out: page_captured: bool
        description: "Turn a pasted thread or transcript into a reviewable curata page, deduped and checklist-complete."
        requires: capture_thread, create_page, patch_page

        flow {
          state RUN_CAPTURE -> call(capture_thread, "the pasted content, source if known, page_type if not the default captured-qa") -> next
          state REVIEW_CANDIDATES -> gate(human_approval) -> next
          state FILL_CHECKLIST -> evaluate(returned_checklist vs thread_content) -> next
          state ASK_MISSING -> gate(human_approval) -> WRITE_PAGE
          state WRITE_PAGE -> call(create_page, "capture_token plus dedup_ack: new, or patch_page the matched slug instead if the human picked an existing candidate") -> TERMINATE("Thread captured, no duplicate created")
        }
      }
      ```
- type: section
  eyebrow: Key Rules
  heading: Rules for this skill
  components:
  - type: callout
    variant: info
    title: capture_thread first, always
    body: |
      Never create a captured page without running capture_thread first, the capture_token it returns is required and expires in about 15 minutes. If it flags a near-duplicate, the human decides: a clear match gets patched, anything else becomes a new page.

      Missing provenance (source, who said it) is a stop, not a guess. Ask before writing.
pack:
  targets:
  - claude
  - cursor
