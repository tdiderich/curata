title: "Skill - Weekly Highlights (superseded)"
subtitle: This manual flow is superseded by the generate_digest MCP tool. Call generate_digest instead of following the steps below.
shell: standard
skill:
  trigger: "weekly highlights, weekly digest, what happened this week, review digest"
dashboard:
  prompt: |
    This workflow is superseded. Call generate_digest directly (no
    arguments), then read_page the slug it returns - see the curata-digest
    skill for the full reference.
  description: "Superseded - call generate_digest instead"
components:
  - type: section
    eyebrow: Overview
    heading: Superseded by generate_digest
    components:
      - type: callout
        variant: warn
        title: Don't follow this flow, call the tool
        body: |
          This page used to describe a manual flow: scan every page's trust state, split what became trusted this week from what's still pending, draft a digest, gate it, publish it. The generate_digest MCP tool now does that in one call and writes the same kind of dated digest page, so there is nothing left to run here by hand.
      - type: definition_list
        items:
          - term: Replacement
            definition: "generate_digest - takes no arguments, computes the window since the last run, writes a dated page to the Digests folder, and returns slug, folderId, created, windowStart, windowEnd, and a summary."
          - term: Where to look
            definition: The curata-digest skill covers cadence, what each digest section contains, and how to read a digest back. Run generate_digest the same way you'd run any other skill.

  - type: section
    eyebrow: Migration
    heading: If you customized this page
    components:
      - type: callout
        variant: info
        title: Your edits aren't lost
        body: |
          If your org edited this page's setup or flow before generate_digest existed, that content still lives in this page's version history. generate_digest doesn't read anything from here - it computes the digest server-side. Anything you want carried forward (a custom digest folder, extra sections) needs to move into how you call and read generate_digest, not into this page.
