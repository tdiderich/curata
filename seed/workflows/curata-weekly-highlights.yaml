title: "Skill - Weekly Highlights"
subtitle: Scan the week across every account and publish a WIN/WATCH digest the team reads in five minutes.
shell: standard
skill:
  trigger: "weekly highlights, weekly digest, what happened this week"
  setup:
    - key: chatter_tools
      ask: "Which tools have customer chatter worth scanning weekly - Slack, Teams, email? Name each one."
    - key: chatter_channels
      ask: "What's the channel naming pattern that identifies customer channels, so the scan covers all of them without you listing each?"
    - key: recording_tool
      ask: "Which tool has call recordings or transcripts, if you want last week's calls in the scan?"
    - key: team_channel
      ask: "Which channel should the recap message land in, if you want the digest posted and not just written to a page?"
dashboard:
  prompt: |
    Run the Weekly Highlights skill. Follow the flow on this page to scan the
    past 7 days across all accounts and publish the WIN/WATCH digest.
  description: "Cross-account WIN/WATCH digest, weekly"
components:
  - type: section
    eyebrow: Overview
    heading: What this skill does
    components:
      - type: callout
        variant: info
        title: Five-minute Monday briefing, generated for you
        body: |
          Scans every customer's pages and chatter for the past 7 days, splits what it finds into WINs (momentum worth naming) and WATCHes (risks worth acting on), and publishes a dated digest page. Run it before the Monday standup.
      - type: definition_list
        items:
          - term: Trigger
            definition: Scheduled weekly or manual - Monday morning before the team standup.
          - term: Data Sources
            definition: All customer pages in this curata instance, plus chatter and calls from the past 7 days. See the Data Model reference for how each gets used differently.
          - term: Output
            definition: A dated weekly highlights page with WINs, WATCHes, and any account needing attention before next standup - plus a draft recap message for your team channel.

  - type: section
    eyebrow: Setup
    heading: Customer Context
    components:
      - type: callout
        variant: warn
        title: One-time setup, mostly chatter
        body: |
          No per-customer setup here: the channel pattern is what lets one run cover every account. Every {{placeholder}}-style tool name in the flow below stands in for a real MCP tool. Answer once, replace, done.
      - type: definition_list
        items:
          - term: Tools
            definition: Which tools have customer chatter worth scanning weekly - Slack, Teams, email? Name each one.
          - term: Channel pattern
            definition: What's the channel naming pattern that identifies customer channels, so the scan covers all of them without you listing each?
          - term: Recording tool
            definition: Which tool has call recordings or transcripts, if you want last week's calls in the scan?
          - term: Team channel
            definition: Which channel should the recap message land in, if you want the digest posted and not just written to a page?

  - type: section
    eyebrow: Prerequisites
    heading: Before you run this skill
    components:
      - type: callout
        variant: warn
        title: Required inputs
        body: |
          - At least one customer page set in curata to scan
          - The date range to cover (defaults to the past 7 days)

          Customer pages stay untouched - this skill only writes the digest page and drafts the recap message.

  - type: section
    eyebrow: Flow
    heading: Validated Flow
    components:
      - type: markdown
        body: |
          `YourChatterTool` below stands in for whatever tools you named in answer to the setup questions above - replace it with the real tool names before running this for your org. Before executing the fence, fetch `GET /api/docs/agl` for execution semantics.

          ```agl
          spec WeeklyHighlights {
            in: none: str
            out: digest_published: bool
            description: "Scan the week across every account and publish a WIN/WATCH digest the team reads in five minutes."
            requires: list_pages, read_page, write_page, YourChatterTool

            flow {
              state SCAN_PAGES -> call(list_pages, "customer pages changed in the past 7 days") -> next
              state READ_CHANGES -> call(read_page, "each changed page, plus open annotations") -> next
              state SCAN_CHATTER -> call(YourChatterTool, "customer channels from the confirmed pattern, past 7 days") -> next
              state SYNTHESIZE_WIN_WATCH -> evaluate(week_activity vs win_watch_shape) -> next
              state DRAFT_DIGEST -> evaluate(win_watch_items vs five_minute_read) -> next
              state PROPOSE_DIGEST -> gate(human_approval) -> WRITE_DIGEST
              state WRITE_DIGEST -> call(write_page, "the dated weekly highlights page") -> next
              state POST_RECAP -> call(YourChatterTool, "draft the recap message to the team channel, a human sends it") -> TERMINATE("Weekly highlights published")
            }
          }
          ```

  - type: section
    eyebrow: Key Rules
    heading: Rules for this skill
    components:
      - type: callout
        variant: info
        title: Digest, don't dump
        body: |
          Pick the three to five items per bucket that matter, ordered by urgency or ARR. Anything urgent goes in a callout at the top, never buried in the list. Link every highlight to its customer page.

          Skip anything you're unsure belongs and link the customer page instead.
