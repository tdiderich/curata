title: "Skill - Map Org"
subtitle: Read CODEOWNERS and team directory structure across repos and draft a governance proposal page. A human owner executes it, this skill never touches groups or rules directly.
shell: standard
skill:
  trigger: "map our org structure, propose approval groups, draft groups from codeowners, org chart for curata"
  setup:
    - key: repo_scope
      ask: "Which repos should this skill read CODEOWNERS and team directories from? Name them, or say 'everything this agent has access to'."
    - key: proposal_folder
      ask: "Which folder should the proposal page land in, if you want a default rather than picking each time? Optional."
dashboard:
  prompt: |
    Run the Map Org skill. Tell me which repos to read, then review the
    proposal page it drafts - nothing is created or changed in your
    approval groups until you act on it yourself.
  description: "Propose approval groups from CODEOWNERS, you execute it"
components:
  - type: section
    eyebrow: Overview
    heading: What this skill does
    components:
      - type: callout
        variant: info
        title: Propose only, never execute
        body: |
          Reads CODEOWNERS files and team directory structure across the named repos, then drafts one proposal page: suggested approval groups, who belongs in each, and which folders each group should approve. This skill only writes that one page. It never calls create_group, update_group, or set_rules - a human owner reads the proposal and creates the real groups and rules themselves.
      - type: definition_list
        items:
          - term: Trigger
            definition: Manual - run when setting up approval groups for the first time, or whenever team or CODEOWNERS structure changes enough to warrant a refresh.
          - term: Data Sources
            definition: CODEOWNERS files and team directory structure across the repos this agent can access.
          - term: Output
            definition: One proposal page listing suggested groups, memberships, and folder approval rules. No group, membership, or rule is created - the page is a plan, not an action.

  - type: section
    eyebrow: Setup
    heading: Optional Defaults
    components:
      - type: callout
        variant: warn
        title: Nothing required, two things worth deciding once
        body: |
          This skill runs on curata plus whatever repos the agent can already read. No other MCP tool is required.
      - type: definition_list
        items:
          - term: Repo scope
            definition: Which repos should this skill read CODEOWNERS and team directories from? Name them, or say "everything this agent has access to."
          - term: Proposal folder
            definition: Which folder should the proposal page land in, if you want a default rather than picking each time? Optional.

  - type: section
    eyebrow: Prerequisites
    heading: Before you run this skill
    components:
      - type: callout
        variant: warn
        title: Required inputs
        body: |
          - Read access to at least one repo with a CODEOWNERS file or a team directory structure
          - Nothing else - no external MCP tool beyond curata itself is required

  - type: section
    eyebrow: Flow
    heading: Validated Flow
    components:
      - type: markdown
        body: |
          Before executing the fence, fetch `GET /api/docs/agl` for execution semantics.

          ```agl
          spec MapOrg {
            in: repos: str
            out: proposal_published: bool
            description: "Read CODEOWNERS and team directory structure across repos and draft a governance proposal page. Never calls create_group, update_group, or set_rules."
            requires: read_page, create_page

            flow {
              state READ_CODEOWNERS -> call(read_files, "CODEOWNERS files and team directory structure across the named repos") -> next
              state CHECK_CODEOWNERS_PRESENT -> evaluate(each_repo vs codeowners_or_team_directory_found) -> branch

              branch CHECK_CODEOWNERS_PRESENT {
                if missing -> FLAG_GAP
                if found -> FILTER_PLACEHOLDER
              }

              state FLAG_GAP -> evaluate(repo vs no_group_proposed_note_gap_in_summary) -> next
              state FILTER_PLACEHOLDER -> evaluate(findings vs exclude_seed_demos_and_template_placeholder_content) -> next
              state CHECK_EXISTING -> call(read_page, "any existing groups or approval rules already documented, so the proposal doesn't repeat what's already set up") -> next
              state DRAFT_GROUPS -> evaluate(codeowners_and_directories vs suggested_groups_memberships_and_folder_rules) -> next
              state PROPOSE -> gate(human_approval) -> next
              state WRITE_PROPOSAL -> call(create_page, "one proposal page listing suggested groups, memberships, and folder approval rules") -> TERMINATE("Proposal published, no group or rule created")
            }
          }
          ```

  - type: section
    eyebrow: Key Rules
    heading: Rules for this skill
    components:
      - type: callout
        variant: info
        title: This is governance config, propose-only
        body: |
          Never call create_group, update_group, or set_rules from this skill, under any circumstance, even if the proposal looks obviously correct. Draft the one proposal page, gate it, publish it, stop. A human owner reads the proposal and executes it themselves - creating the groups, adding members, and setting folder rules is their call, not this skill's.

          If a repo has no CODEOWNERS file and no team directory structure, flag the gap in the proposal and propose nothing for that repo. Never guess ownership from file paths or commit history.

          Never treat seed content, demo content, or a template's placeholder team roster as real team data. Fictional example org charts, anything under seed/ or demos/, and unfilled template placeholders get excluded from the findings entirely, not proposed as if they described this org.
