        x: 20
        y: 85
        color: green
      - label: "Bulk CSV export"
        x: 15
        y: 70
        color: green
      - label: "Custom themes"
        x: 30
        y: 25
        color: default
      - label: "AI summaries"
        x: 70
        y: 80
        color: teal
      - label: "Audit retention"
        x: 80
        y: 75
        color: teal
      - label: "Webhooks"
        x: 75
        y: 30
        color: yellow
      - label: "PDF watermark"
        x: 65
        y: 15
        color: default
      - label: "Real-time collab"
        x: 85
        y: 90
        color: red
      - label: "Dark mode"
