title: "Feature Prioritization"
shell: standard
components:
  - type: callout
    variant: info
    title: What this page shows
    body: "A quadrant plot mapping feature requests by effort vs impact. Quadrant labels name the decision, not just high/low."
  - type: quadrant
    title: "Product Roadmap Prioritization"
    x_axis: "Implementation Effort"
    y_axis: "Customer Impact"
    height: 500
    quadrants:
      - "Quick Win"
      - "Big Bet"
      - "Fill-In"
      - "Question Mark"
    points:
      - label: "SSO enforcement"
        x: 0.20
        y: 0.85
        color: green
      - label: "Bulk CSV export"
        x: 0.15
        y: 0.70
        color: green
      - label: "Custom themes"
        x: 0.30
        y: 0.25
        color: default
      - label: "AI summaries"
        x: 0.70
        y: 0.80
        color: teal
      - label: "Audit retention"
        x: 0.80
        y: 0.75
        color: teal
      - label: "Webhooks"
        x: 0.75
        y: 0.30
        color: yellow
      - label: "PDF watermark"
        x: 0.65
        y: 0.15
        color: default
      - label: "Real-time collab"
        x: 0.85
        y: 0.90
        color: red
      - label: "Dark mode"
        x: 0.25
        y: 0.40
        color: default
      - label: "Mobile push"
        x: 0.40
        y: 0.20
        color: yellow
