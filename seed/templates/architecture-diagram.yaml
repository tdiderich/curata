title: The AI-Native Loop
shell: standard
components:
  - type: callout
    variant: info
    title: What this page shows
    body: "The five-layer loop that makes a knowledge brain compound instead of reset. Each node is a layer, each connection is labeled with what actually flows between them."
  - type: architecture
    title: Knowledge Loop
    direction: left_to_right
    nodes:
      - id: capture
        label: Capture
        detail: "Sensors and agents"
        color: teal
      - id: review
        label: Review
        detail: "Human validation"
        color: yellow
      - id: brain
        label: Brain
        detail: "Trusted pages"
        color: green
      - id: output
        label: Output
        detail: "Digests and answers"
        color: default
    connections:
      - from: capture
        to: review
        label: raw
      - from: review
        to: brain
        label: approved
      - from: brain
        to: output
        label: query
