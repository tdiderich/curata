title: "{{company_name}} - {{meeting_type}} Agenda"
shell: document
components:
  - type: header
    eyebrow: Agenda
    title: "{{company_name}} - {{meeting_type}}"
    subtitle: "{{meeting_date}}"
  - type: definition_list
    items:
      - term: When
        definition: "{{meeting_date}}, {{meeting_time}}"
      - term: Attendees
        definition: "{{attendees}}"
      - term: Goal
        definition: "{{meeting_goal}}"
      - term: Prepared by
        definition: "{{prepared_by}}"

  - type: section
    eyebrow: Agenda
    heading: What we're covering
    components:
      - type: steps
        numbered: true
        items:
          - title: "{{topic_1}}"
            detail: "{{topic_1_context}} Owner: {{topic_1_owner}}."
          - title: "{{topic_2}}"
            detail: "{{topic_2_context}} Owner: {{topic_2_owner}}."
          - title: "{{topic_3}}"
            detail: "{{topic_3_context}} Owner: {{topic_3_owner}}."

  - type: section
    eyebrow: Decisions
    heading: Decisions needed on this call
    components:
      - type: callout
        variant: warn
        title: Leave with answers
        body: |
          {{decisions_needed}}

          Decisions made on the call stay decisions. Anything left open becomes a next step with an owner and a date.

  - type: section
    eyebrow: Follow-up
    heading: Next steps
    components:
      - type: table
        filterable: false
        columns:
          - key: item
            label: Item
          - key: owner
            label: Owner
          - key: due
            label: Due
        rows:
          - item: "{{next_step_1}}"
            owner: "{{next_step_1_owner}}"
            due: "{{next_step_1_due}}"

  - type: callout
    variant: info
    title: This is a curata template.
    body: "The Call Prep skill fills this agenda from the customer's open items and syncs it into the calendar event description. Filling it by hand works too. Keep topics to three or fewer, and fill the next steps table live so it leaves with owners and dates."
