title: "Plan: {{plan_title}}"
subtitle: "{{plan_subtitle}}"
shell: standard
components:
  - type: section
    eyebrow: Context
    heading: "{{context_heading}}"
    components:
      - type: markdown
        body: |
          {{context_body}}

  - type: section
    eyebrow: Scope
    heading: Current State vs. Target State
    components:
      - type: split_compare
        left:
          eyebrow: Current
          title: Where we are
          stats:
            - label: "{{dimension_1}}"
              value: "{{current_1}}"
              color: red
            - label: "{{dimension_2}}"
              value: "{{current_2}}"
              color: red
            - label: "{{dimension_3}}"
              value: "{{current_3}}"
              color: red
        right:
          eyebrow: Target
          title: Where we're going
          stats:
            - label: "{{dimension_1}}"
              value: "{{target_1}}"
              color: green
            - label: "{{dimension_2}}"
              value: "{{target_2}}"
              color: green
            - label: "{{dimension_3}}"
              value: "{{target_3}}"
              color: green

  - type: section
    eyebrow: Phases
    heading: Phases and gates
    components:
      - type: graph
        title: "{{plan_title}} - phase plan"
        height: 460
        direction: top_to_bottom
        row_labels:
          - 01 / Phases
          - 02 / Done when
          - 03 / What it unlocks
        nodes:
          - id: phase1
            label: "{{phase_1_name}}"
            detail: "{{phase_1_scope}}"
            row: 0
            column: 0
            color: teal
            status: active
          - id: phase2
            label: "{{phase_2_name}}"
            detail: "{{phase_2_scope}}"
            row: 0
            column: 1
            color: teal
            status: upcoming
          - id: gate1
            label: Gate 1 check
            detail: "{{phase_1_done_when}}"
            row: 1
            column: 0
            color: yellow
          - id: gate2
            label: Gate 2 check
            detail: "{{phase_2_done_when}}"
            row: 1
            column: 1
            color: yellow
          - id: unlock1
            label: "{{phase_1_unlocks}}"
            detail: What finishing this phase makes possible
            row: 2
            column: 0
            color: green
          - id: unlock2
            label: "{{phase_2_unlocks}}"
            detail: What finishing this phase makes possible
            row: 2
            column: 1
            color: green
        edges:
          - from: phase1
            to: phase2
          - from: phase1
            to: gate1
            style: dashed
          - from: phase2
            to: gate2
            style: dashed
          - from: gate1
            to: unlock1
            style: dashed
          - from: gate2
            to: unlock2
            style: dashed

  - type: section
    eyebrow: Tasks
    heading: Work Breakdown
    components:
      - type: tree
        show_filter_toggle: true
        default_filter: all
        nodes:
          - label: "Phase 1: {{phase_1_name}}"
            status: active
            children:
              - label: "{{task_1_1}}"
                status: upcoming
              - label: "{{task_1_2}}"
                status: upcoming
          - label: "Phase 2: {{phase_2_name}}"
            status: upcoming
            children:
              - label: "{{task_2_1}}"
                status: upcoming
              - label: "{{task_2_2}}"
                status: upcoming

  - type: section
    eyebrow: Risks
    heading: Risks & Open Questions
    components:
      - type: table
        filterable: false
        columns:
          - key: risk
            label: Risk
          - key: likelihood
            label: Likelihood
          - key: impact
            label: Impact
          - key: mitigation
            label: Mitigation
        rows:
          - risk: "{{risk_1}}"
            likelihood: "{{risk_1_likelihood}}"
            impact: "{{risk_1_impact}}"
            mitigation: "{{risk_1_mitigation}}"

  - type: section
    eyebrow: Verification
    heading: How to Test
    components:
      - type: steps
        numbered: true
        items:
          - title: "{{verification_step_1}}"
            detail: "{{verification_detail_1}}"
          - title: "{{verification_step_2}}"
            detail: "{{verification_detail_2}}"

  - type: callout
    variant: info
    title: This is a curata template.
    body: "The Plan skill builds this page for you - it interviews you for every {{placeholder}} variable, then publishes through create_from_template. Filling it by hand works too. The split_compare should reflect real current-state observations. The gap between current and target drives the plan. Add phase columns to the graph if the real plan has more than two, and update tree node statuses as work progresses."
