title: "{{company_name}} - ROI Proposal"
shell: standard
print_flow: continuous
components:
  - type: hero_banner
    title: "{{company_name}} + {{product_name}}"
    subtitle: "{{proposal_type}}"
  - type: divider

  - type: section
    eyebrow: WHERE IT HURTS
    heading: Current Pain Points
    components:
      - type: definition_list
        items:
          - term: "{{pain_1_label}}"
            definition: "{{pain_1, in the customer's own words from discovery}}"
          - term: "{{pain_2_label}}"
            definition: "{{pain_2, in the customer's own words from discovery}}"
          - term: "{{pain_3_label}}"
            definition: "{{pain_3, or delete this entry}}"

  - type: divider
  - type: section
    eyebrow: THE PATH
    heading: Past, current, and future
    components:
      - type: graph
        title: "Where {{company_name}} sits today"
        height: 460
        direction: top_to_bottom
        row_labels:
          - 01 / Approach
          - 02 / How it works
          - 03 / The gap
        nodes:
          - id: past
            label: Past
            detail: "{{past_approach}}"
            row: 0
            column: 0
            color: red
            status: completed
          - id: current
            label: Current
            detail: "{{current_approach}}"
            row: 0
            column: 1
            color: teal
            status: active
          - id: future
            label: "With {{product_name}}"
            detail: "{{future_approach}}"
            row: 0
            column: 2
            color: green
            status: upcoming
          - id: past-state
            label: How it works
            detail: "{{past_how}}"
            row: 1
            column: 0
            color: red
          - id: current-state
            label: How it works
            detail: "{{current_how}}"
            row: 1
            column: 1
            color: teal
          - id: future-state
            label: How it works
            detail: "{{future_how}}"
            row: 1
            column: 2
            color: green
          - id: past-gap
            label: The gap
            detail: "{{past_gap}}"
            row: 2
            column: 0
            color: red
          - id: current-gap
            label: The gap
            detail: "{{current_gap}}"
            row: 2
            column: 1
            color: teal
        edges:
          - from: past
            to: current
          - from: current
            to: future
          - from: past
            to: past-state
            style: dashed
          - from: current
            to: current-state
            style: dashed
          - from: future
            to: future-state
            style: dashed
          - from: past-state
            to: past-gap
            style: dashed
          - from: current-state
            to: current-gap
            style: dashed

  - type: divider
  - type: section
    eyebrow: YOUR PIPELINE
    heading: Real integration points
    components:
      - type: pipeline
        title: "{{company_name}} + {{product_name}}"
        height: 340
        inputs:
          - label: "{{input_system_1}}"
            detail: "{{input_system_1_role}}"
            color: teal
          - label: "{{input_system_2, or delete this entry}}"
            detail: "{{input_system_2_role}}"
            color: teal
        stages:
          - label: "{{product_name}}"
            detail: "{{product_stage_detail}}"
            capabilities:
              - label: "{{capability_1}}"
                detail: "{{capability_1_detail}}"
              - label: "{{capability_2}}"
                detail: "{{capability_2_detail}}"
              - label: "{{capability_3}}"
                detail: "{{capability_3_detail}}"
        outputs:
          - label: "{{output_1}}"
            detail: "{{output_1_detail}}"
            color: green
          - label: "{{output_2}}"
            detail: "{{output_2_detail}}"
            color: yellow
        context:
          - label: "{{context_system_1}}"
            detail: "{{context_system_1_role}}"
            color: teal

  - type: divider
  - type: section
    eyebrow: ROI
    heading: Success criteria, then validated impact
    components:
      - type: aside
        body: Starts as targets going into the evaluation. Update in place as results come in - by the end this section is the validated impact readout, not a promise.
      - type: split_compare
        left:
          eyebrow: BEFORE
          title: Today
          stats:
            - label: "{{roi_metric_1}}"
              value: "{{roi_metric_1_before}}"
              color: red
            - label: "{{roi_metric_2}}"
              value: "{{roi_metric_2_before}}"
              color: red
            - label: "{{roi_metric_3}}"
              value: "{{roi_metric_3_before}}"
              color: red
        right:
          eyebrow: "WITH {{product_name}}"
          title: Validated
          stats:
            - label: "{{roi_metric_1}}"
              value: "{{roi_metric_1_after}}"
              color: green
            - label: "{{roi_metric_2}}"
              value: "{{roi_metric_2_after}}"
              color: green
            - label: "{{roi_metric_3}}"
              value: "{{roi_metric_3_after}}"
              color: teal

  - type: callout
    variant: success
    title: The compounding win
    body: "{{compounding_win - the sentence that explains why this gets more valuable over time, not less. The strongest close a proposal has.}}"

  - type: divider
  - type: section
    eyebrow: GETTING STARTED
    heading: What Deployment Looks Like
    components:
      - type: steps
        numbered: true
        items:
          - title: "{{step_1}}"
            detail: "{{step_1_timeline}}"
          - title: "{{step_2}}"
            detail: "{{step_2_timeline}}"
          - title: "{{step_3}}"
            detail: "{{step_3_timeline}}"
          - title: "{{step_4}}"
            detail: "{{step_4_timeline}}"

  - type: divider
  - type: section
    eyebrow: RESOURCES
    heading: More to look at
    components:
      - type: card_grid
        min_width: 240
        cards:
          - title: "{{resource_1_title}}"
            description: "{{resource_1_description}}"
            href: "{{resource_1_link}}"
            badge:
              label: Video
              color: teal
          - title: "{{resource_2_title}}"
            description: "{{resource_2_description}}"
            href: "{{resource_2_link}}"
            badge:
              label: Docs
              color: default

  - type: callout
    variant: info
    title: This is a curata template.
    body: "Built to be sent, not archived: hero at the top, ROI split_compare as the centerpiece, deployment steps at the bottom. Fill the pain points in the customer's own words from discovery - paraphrased pain reads like marketing. Keep the ROI metrics to numbers you can actually validate during the evaluation, and update the right column in place as results land. Delete this note once cloned."
