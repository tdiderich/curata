title: "{{company_name}} - Deployment Status"
subtitle: The running record of the rollout - phases, gates, and what's open right now.
shell: standard
components:
  - type: section
    eyebrow: ACCOUNT
    components:
      - type: meta
        fields:
          - key: Contract start
            value: "{{contract_start}}"
          - key: Contract end
            value: "{{contract_end}}"
          - key: Journey stage
            value: "{{journey_stage - Onboarding, Operationalizing, or Adopted}}"
          - key: Overall health
            value: "{{overall_health}}"

  - type: section
    eyebrow: AT A GLANCE
    heading: What done looks like
    components:
      - type: stat_grid
        columns: 2
        stats:
          - label: 90-Day Goal
            value: "{{ninety_day_goal}}"
            detail: "{{ninety_day_metric - the metric it gets measured on}}"
            color: teal
          - label: "{{target_metric_name}}"
            value: "{{target_metric_value}}"
            detail: "{{target_metric_result - what hitting it proves}}"
            color: green

  - type: divider
  - type: section
    eyebrow: YOUR PIPELINE
    heading: Real integration points
    components:
      - type: pipeline
        title: "{{company_name}} + {{product_name}}"
        height: 340
        inputs:
          - label: "{{input_system_1}}"
            detail: "{{input_system_1_role}}"
            color: teal
          - label: "{{input_system_2, set dim true if discussed but not connected}}"
            detail: "{{input_system_2_role}}"
            color: teal
            dim: true
        stages:
          - label: "{{product_name}}"
            detail: "{{product_stage_detail}}"
            capabilities:
              - label: "{{capability_1}}"
                detail: "{{capability_1_detail}}"
              - label: "{{capability_2}}"
                detail: "{{capability_2_detail}}"
        outputs:
          - label: "{{output_1}}"
            detail: "{{output_1_detail}}"
            color: green
          - label: "{{output_2}}"
            detail: "{{output_2_detail}}"
            color: yellow
        context:
          - label: "{{context_system_1}}"
            detail: "{{context_system_1_role}}"
            color: teal

  - type: divider
  - type: section
    eyebrow: DEPLOYMENT PLAN
    heading: Phases, gates, pain resolved
    components:
      - type: graph
        title: "{{company_name}} Deployment Plan"
        height: 560
        direction: top_to_bottom
        row_labels:
          - 01 / Release phases
          - 02 / How we know it's done
          - 03 / Key pain point resolved
        nodes:
          - id: scoped
            label: Scoped
            detail: Plan and gates agreed
            row: 0
            column: 0
            color: teal
            status: completed
          - id: phase1
            label: "{{phase_1_name}}"
            detail: "{{phase_1_ships}}"
            row: 0
            column: 1
            color: teal
            status: active
          - id: phase2
            label: "{{phase_2_name}}"
            detail: "{{phase_2_ships}}"
            row: 0
            column: 2
            hex: "#7844CC"
          - id: phase3
            label: "{{final_phase_name}}"
            detail: "{{final_phase_ships}}"
            row: 0
            column: 3
            color: teal
          - id: gate1
            label: Gate 1 check
            detail: "{{phase_1_done_when}}"
            row: 1
            column: 1
            color: yellow
          - id: gate2
            label: Gate 2 check
            detail: "{{phase_2_done_when}}"
            row: 1
            column: 2
            color: yellow
          - id: gate3
            label: Gate 3 check
            detail: "{{final_phase_done_when}}"
            row: 1
            column: 3
            color: yellow
          - id: pain1
            label: "{{pain_1_resolved}}"
            detail: "{{pain_1_what_it_fixes}}"
            row: 2
            column: 1
            color: green
          - id: pain2
            label: "{{pain_2_resolved}}"
            detail: "{{pain_2_what_it_fixes}}"
            row: 2
            column: 2
            color: green
          - id: pain3
            label: "{{pain_3_resolved}}"
            detail: "{{pain_3_what_it_fixes}}"
            row: 2
            column: 3
            color: green
        edges:
          - from: scoped
            to: phase1
          - from: phase1
            to: phase2
          - from: phase2
            to: phase3
          - from: phase1
            to: gate1
            style: dashed
          - from: phase2
            to: gate2
            style: dashed
          - from: phase3
            to: gate3
            style: dashed
          - from: gate1
            to: pain1
            style: dashed
          - from: gate2
            to: pain2
            style: dashed
          - from: gate3
            to: pain3
            style: dashed

  - type: divider
  - type: section
    eyebrow: OPEN ITEMS
    heading: What's open right now
    components:
      - type: priority_queue
        group_by: horizon
        filterable: true
        show_counts: true
        show_dates: true
        items:
          - label: "{{open_item_1 - agenda topic for the next call}}"
            detail: "{{open_item_1_context - what changed since the last call and who owes what}}"
            status: active
            horizon: now
            owner: "{{open_item_1_owner}}"
            tags:
              - label: Agenda
                color: teal
          - label: "{{open_item_2 - anything off-plan that came out of a call}}"
            detail: "{{open_item_2_context}}"
            status: priority
            horizon: next
            owner: "{{open_item_2_owner}}"
            tags:
              - label: "{{phase_it_belongs_to}}"
                color: default
          - label: "{{milestone_1 - like the renewal decision date}}"
            detail: "{{milestone_1_context - why the date matters and what it gates}}"
            due: "{{milestone_1_due}}"
            status: upcoming
            horizon: later
            owner: "{{milestone_1_owner}}"
            tags:
              - label: Milestone
                color: yellow
                emphasis: true

  - type: callout
    variant: info
    title: This is a curata template.
    body: "This page is the running record of the deployment, not a snapshot - nothing on it is machine written, so anything parked here stays until a human clears it. Build the deployment plan graph live on the kickoff call as phases and gates get agreed, and add or remove phase columns to match the real plan. Set dim on pipeline entries discussed but not connected yet. Keep the open items queue honest: agenda items carry no due date, milestones always do. Delete this note once cloned."
