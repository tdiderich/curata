title: "Q3 Regional Performance"
shell: standard
components:
  - type: callout
    variant: info
    title: What this page shows
    body: "A chart_group lays out multiple charts as one titled unit with a shared column count, instead of hand-wiring a columns layout. Here: quarterly revenue by region next to the customer acquisition cost trend."
  - type: chart_group
    title: "Q3 Regional Performance"
    columns: 2
    components:
      - type: chart
        kind: bar
        title: "Revenue by Region"
        y_label: "Revenue ($K)"
        data:
          - label: "AMER"
            value: 1840
            color: green
          - label: "EMEA"
            value: 1120
            color: teal
          - label: "APAC"
            value: 640
            color: yellow
          - label: "LATAM"
            value: 210
            color: default
      - type: chart
        kind: timeseries
        title: "Customer Acquisition Cost"
        y_label: "CAC ($)"
        series:
          - label: "AMER"
            color: green
            points:
              - label: "Jul"
                value: 420
              - label: "Aug"
                value: 395
              - label: "Sep"
                value: 360
          - label: "EMEA"
            color: teal
            points:
              - label: "Jul"
                value: 510
              - label: "Aug"
                value: 540
              - label: "Sep"
                value: 480
