title: "{{skill_name}}"
shell: document
skill:
  trigger: "{{trigger_phrases}}"
  setup:
    - key: crm_tool
      ask: "Which tool holds this skill's base data - domain, deal stage, contract dates, the long-lived facts? Name the exact MCP tool."
    - key: crm_fields
      ask: "Confirm the exact field names for whatever facts this skill reads - don't assume, these vary a lot by org."
    - key: recording_tool
      ask: "Which tool has call recordings or transcripts, if this skill touches calls?"
    - key: longform_tool
      ask: "Which tool holds long-form context - specs, docs, project tickets - if this skill needs it?"
    - key: chatter_tools
      ask: "Which tools have the day-to-day chatter for this - Slack, Teams, email, a ticketing system? Name each one that applies."
    - key: chatter_channels
      ask: "What's the channel or thread naming pattern for the relevant channels?"
    - key: chatter_domains
      ask: "Which email domains matter, if this skill pulls from email?"
    - key: chatter_tickets
      ask: "Which project or label identifies the relevant tickets, if this skill pulls from a ticketing system?"
components:
  - type: header
    title: "{{skill_name}}"
    eyebrow: Skill
    subtitle: "{{description}}"
  - type: definition_list
    items:
      - term: Trigger
        definition: "{{trigger_phrases}}"
      - term: Requires
        definition: "{{required_tools}}. See the Data Model reference for how CRM, chatter, recordings, and long-form tools each play a different role."
      - term: Owner
        definition: "{{owner}}"
  - type: section
    eyebrow: Setup
    heading: Base data, recordings, long-form
    components:
      - type: callout
        variant: warn
        title: One-time setup
        body: |
          Drop whichever of these don't apply to this specific skill. Every `{{mustache}}` placeholder in the flow below is a real question, not filler.
      - type: definition_list
        items:
          - term: Base data (CRM)
            definition: "{{crm_tool_ask}}"
          - term: Base data fields
            definition: "{{crm_fields_ask}}"
          - term: Recent updates (call recordings)
            definition: "{{recording_tool_ask}}"
          - term: Long-form context (docs, tickets)
            definition: "{{longform_tool_ask}}"

  - type: section
    eyebrow: Setup
    heading: Customer Context
    components:
      - type: callout
        variant: warn
        title: Slack, email, tickets - the chatter layer
        body: |
          This is the noisy, high-volume layer, different in character from base data. Confirm which tools and patterns actually identify the customer or subject before pulling anything in.
      - type: definition_list
        items:
          - term: Tools
            definition: "{{chatter_tools_ask}}"
          - term: Channel pattern
            definition: "{{chatter_channels_ask}}"
          - term: Email domains
            definition: "{{chatter_domains_ask}}"
          - term: Ticket project/label
            definition: "{{chatter_tickets_ask}}"

  - type: markdown
    body: |
      ## Before you clone this

      See the Data Model reference for why base data, chatter, recordings, and long-form context each need different handling. Ask the human the setup questions above, then pass the answers as `variables` to `create_from_template` - the `{{mustache}}` placeholders in the flow below get filled in automatically, no follow-up edit needed. An unanswered placeholder means this skill will call a tool that doesn't exist yet for this org.

      ## Steps

      {{steps}}

      ## Validated flow

      For a flow with branches, gates, or invariants, replace the steps above
      with an `agl` fence. Curata runs the AGL static analyzer on every
      fence at save, so an unreachable state or an unsound invariant blocks
      the write. **Before executing any `agl` fence, fetch `GET /api/docs/agl`
      first.** It defines what `gate()` blocks on, what `branch` evaluates,
      and what an `invariant` denies. Skeleton (change the fence language from `text` to
      `agl` to activate validation):

      ```text
      spec {{skill_name}} {
        in: none: str
        out: done: bool
        description: "{{description}}"
        requires: read_page, patch_page, {{crm_tool}}

        flow {
          state FIRST_STEP -> call({{crm_tool}}, "what to do") -> next
          state CHECK -> evaluate(result vs expectation) -> branch

          branch CHECK {
            if looks_right -> FINISH
            if needs_rework -> FIRST_STEP
          }

          state FINISH -> gate(human_approval) -> TERMINATE("done")
        }
      }
      ```
