title: MCP Tools Reference
subtitle: The full tool surface, grouped by what your agent is trying to do.
shell: standard
components:
  - type: markdown
    body: |
      The curata MCP server exposes about fifty tools. Your agent discovers the exact schemas live from the server (`tools/list` over MCP, or `GET /api/mcp` for names plus accepted params over plain HTTP, where `search_pages` and `search` are the same tool), and the server's own instructions teach connected agents when to reach for what, so this page stays a map, never a contract. The groups below cover the loop end to end: find knowledge, write it, capture it from real work, validate it, and report on it.

  - type: section
    heading: Search and read
    components:
      - type: markdown
        body: |
          Start here. Before answering anything org-specific, `search_pages` first: an approved answer may already exist, and it outranks general knowledge.

          - **search_pages** - full-text search across the brain, trusted channel by default
          - **read_page** - full page content by slug, with caveats and provenance the snippet omits
          - **list_pages** / **list_folders** / **get_folder_structure** - browse the brain's shape
          - **get_related** - pages linked or conceptually near a given page
          - **get_chart** - the content map: every node (template, component page, source page, or anything promoted) with one color from what sits under it. With `term`, one node's children plus suggested reports
          - **get_needs_look** - the chart as a list: every yellow and red child grouped by the node whose source moved. The drift review queue
          - **audit** - your worklist for external drift: yellow/red externals split into `withRecipe` (run the check through your MCP) and `humanOnly`
          - **get_dependents** - per-edge view for one concept or page: dependents, asserter, instances, externals, each with `verifiedAt` and `staleAgainstSource`
          - **mark_verified** - "looked at it": `slug` or `url` plus `term`, `status` holds, needs_change, or unreachable (could not access it this session), `note` for what you found. No new version. Write responses carry `trust` (mode, trustedBehind, hint) so you know when a locked page still shows readers the old version
          - **get_semantic_map** / **get_vocabulary** - the org's concept graph and tag vocabulary
          - **get_versions** / **read_version** - a page's version history; read one version's content, or the line diff between two (`version_id=latest compare_to=previous` answers "what changed")
          - **get_config** / **get_component_reference** - org settings and the component catalog
          - **list_templates** / **list_workflows** / **list_rules** - available templates, skill pages, and the write rules in force

  - type: section
    heading: The content map
    components:
      - type: markdown
        body: |
          Curata draws an content map from what already exists: pages built from a template (`instantiates`), pages that embed another page's components with a `type: ref` block (`embeds`, written by the scan on every save), pages tagged `depends` on a concept some page `asserts`, and external assets put under a node. Anything with three or more children is a node. Change a node's source and everything under it goes yellow; check a child and it goes green; leave it past due or through two more source changes and it goes red. Nobody draws the chart. Humans see it at `/map`, the list at `/map?view=list`, one node at `/map/<term>`.

          - **get_chart** - no args: every node, ranked by fan-out, with `color`, `counts`, `source`. `term`: that node's children (`color`, `reason`, `lastCheckedAt`, `owner`, `dueAt`, `alsoUnder`, `check`) plus `suggestions`: external URLs in the source's or a child's body that probably belong here
          - **get_needs_look** - yellow and red children only, grouped by node
          - **audit** - externals needing a look. `withRecipe` items carry `check: {via, tool, locator, ask}`: run it through that MCP in your session, compare to the source page, then `mark_verified url=... status=holds` or `status=needs_change note=...`. `humanOnly` items have no recipe yet; hand that list to the human, or save `suggestedCheck` with `set_scope_item`
          - **add_to_chart** - put a report under a node: `slug` for a page, or `url` with `label`, `owner`, `due_at`, `check`. Use the suggestions from `get_chart term=...` first
          - **remove_from_chart** - take a page or url out from under a node
          - **set_scope_item** - owner, label or check recipe on an external (shared across nodes), due date on one node's edge
          - **get_chart** nodes carry `group` (active / watching / completed) from the source page's meta Status field, and `source.status` with the raw value
          - **set_chart_node** - `hidden`, `promoted` (show a concept with fewer than three children), or `instructions` (per-node note appended to copied prompts)
          - **rescan_inventory** - re-run the embeds and external-URL scan over every page, after upgrading or changing the ignored domains
          - **map_dependencies** - bulk form of add_to_chart: one call with `term`, `asserts`, `depends`, `references` slugs and `external` urls
          - **get_dependents** / **mark_verified** - the per-edge primitives the chart is built on

          Every `write_page`, `create_page` and `patch_page` response carries `impact` when the page is a node's source: how many pages and externals just went yellow. Say it back to the human.

  - type: section
    heading: Write and edit
    components:
      - type: markdown
        body: |
          Every write passes through org rules. A blocked write returns a teaching error citing the rule that stopped it, so fix the call and retry.

          - **create_page** - new page, fails if the slug exists (search for duplicates first)
          - **write_page** - create or update by slug (upsert)
          - **patch_page** - targeted component operations without rewriting the full YAML. `expected_hash` from read_page, `operations` a JSON array: `replace` / `insert_before` / `insert_after` (id, components), `remove` (id), `prepend` / `append` (components), `set_field` (field: title|subtitle|eyebrow|shell, value). `components` are full component objects. Example: `[{"op":"replace","id":"markdown-0","components":[{"type":"markdown","id":"markdown-0","body":"..."}]}]`
          - **replace_in_page** - simple find and replace inside a page
          - **restore_page_version** - roll a page back to a previous version
          - **create_from_template** - instantiate a template page
          - **move_page** / **create_folder** / **update_folder** - organization

  - type: section
    heading: Capture
    components:
      - type: markdown
        body: |
          - **capture_thread** - paste a working thread or transcript; curata checks it against existing pages, proposes what is worth keeping, and turns the validated answer into a page. This is the flywheel: one agent's good answer becomes every agent's starting point.

  - type: section
    heading: Annotations
    components:
      - type: markdown
        body: |
          - **annotate_page** - leave a note, correction, or talking point on a page
          - **list_annotations** / **list_open_annotations** - read them back
          - **update_annotation** - resolve or edit one

  - type: section
    heading: Trust and validation
    components:
      - type: markdown
        body: |
          - **mark_trusted** / **clear_trusted** - move the human-approved pointer (subject to approval rules)
          - **validate_page** - check YAML against the component schema and org rules without writing
          - **set_rules** - manage the write rules for a folder or page

  - type: section
    heading: Cleanup
    components:
      - type: markdown
        body: |
          - **flag_page** - propose archive, delete, merge, or supersede with evidence; a human disposes on the Cleanup view
          - **list_flags** - pending proposals

  - type: section
    heading: Groups and access
    components:
      - type: markdown
        body: |
          - **create_group** / **update_group** / **delete_group** - manage access groups
          - **add_group_member** / **remove_group_member** / **list_groups** - membership

  - type: section
    heading: Reports and exports
    components:
      - type: markdown
        body: |
          - **generate_digest** - the weekly brain digest: preview the window, then write the page with the human-picked big thing and noteworthy items
          - **export_page** / **export_report** - render a page or report for use outside curata

  - type: callout
    variant: info
    title: The server teaches as you go
    body: |
      Schemas, required params, and current counts always come from the live server, never from this page. Malformed or rule-breaking calls return errors that say exactly how to fix them, so the fastest way to learn the surface is to connect an agent and let it work.
