title: MCP Tools Reference
subtitle: Complete reference for all 6 tools available through the curata MCP server.
shell: standard
components:
  - type: markdown
    body: |
      The curata MCP server exposes 6 tools that your agent can call. These cover the full lifecycle: discovering existing knowledge, reading it, creating new pages, updating them, and adding annotations.

  - type: section
    heading: search_pages
    components:
      - type: markdown
        body: |
          Search your team's knowledge base by keyword or topic. Returns matching pages with titles, snippets, and relevance context.
      - type: table
        filterable: false
        columns:
          - key: param
            label: Parameter
          - key: type
            label: Type
          - key: required
            label: Required
            align: center
          - key: description
            label: Description
        rows:
          - param: query
            type: string
            required: "Yes"
            description: Search query - keywords, phrases, or topics to find.
      - type: markdown
        body: |
          **When to use:** Before creating a page, search first to avoid duplicates. Also useful when an agent needs context - ex. "search for recent postmortems" or "find the onboarding guide."

      - type: code
        language: text
        code: |
          > Search curata for "deployment pipeline"

  - type: divider

  - type: section
    heading: read_page
    components:
      - type: markdown
        body: |
          Read a specific page by its slug. Returns the full YAML content, sections, and any annotations left by the team.
      - type: table
        filterable: false
        columns:
          - key: param
            label: Parameter
          - key: type
            label: Type
          - key: required
            label: Required
            align: center
          - key: description
            label: Description
        rows:
          - param: slug
            type: string
            required: "Yes"
            description: "Page slug (ex. 'q2-revenue-analysis'). Found via search or list."
      - type: markdown
        body: |
          **When to use:** When an agent needs the full content of a specific page - to reference it, update it, or use it as context for new work. Annotations are included, so the agent sees team feedback.

  - type: divider

  - type: section
    heading: list_pages
    components:
      - type: markdown
        body: |
          List all pages in your workspace. Returns titles, slugs, last updated dates, and view counts. No parameters required.
      - type: markdown
        body: |
          **When to use:** To get an overview of what exists in the knowledge base. Useful for orientation at the start of a session, or to find pages to update.

  - type: divider

  - type: section
    heading: write_page
    components:
      - type: markdown
        body: |
          Create or update a page. If a page with the given slug already exists, its content is replaced. If it doesn't exist, a new page is created. Content must be valid kazam YAML.
      - type: table
        filterable: false
        columns:
          - key: param
            label: Parameter
          - key: type
            label: Type
          - key: required
            label: Required
            align: center
          - key: description
            label: Description
        rows:
          - param: title
            type: string
            required: "Yes"
            description: Page title (ex. 'Q2 Revenue Analysis').
          - param: content
            type: string
            required: "Yes"
            description: Full page content in kazam YAML format.
          - param: slug
            type: string
            required: "No"
            description: Explicit slug. If omitted, derived from the title.
      - type: markdown
        body: |
          **When to use:** The primary tool for publishing agent work. Use it to create new pages (deal briefs, postmortems, architecture decisions) or to update existing ones with fresh data.

      - type: callout
        variant: info
        title: write_page is an upsert
        body: |
          If you're not sure whether a page exists, `write_page` is safe - it creates if missing, updates if present. Use `create_page` only when you specifically want to fail on duplicates.

  - type: divider

  - type: section
    heading: create_page
    components:
      - type: markdown
        body: |
          Create a new page. Fails if a page with the same slug already exists - use this when you want to guarantee you're not overwriting existing content.
      - type: table
        filterable: false
        columns:
          - key: param
            label: Parameter
          - key: type
            label: Type
          - key: required
            label: Required
            align: center
          - key: description
            label: Description
        rows:
          - param: title
            type: string
            required: "Yes"
            description: Page title.
          - param: content
            type: string
            required: "Yes"
            description: Full page content in kazam YAML format.
          - param: slug
            type: string
            required: "No"
            description: Explicit slug. If omitted, derived from the title.
      - type: markdown
        body: |
          **When to use:** When the agent is creating something new and should fail if a page with that name already exists - prevents accidental overwrites.

  - type: divider

  - type: section
    heading: annotate_page
    components:
      - type: markdown
        body: |
          Add an annotation to an existing page. Annotations are visible to the team and can target a specific section. Use for observations, suggestions, or proposed edits.
      - type: table
        filterable: false
        columns:
          - key: param
            label: Parameter
          - key: type
            label: Type
          - key: required
            label: Required
            align: center
          - key: description
            label: Description
        rows:
          - param: slug
            type: string
            required: "Yes"
            description: Page slug to annotate.
          - param: text
            type: string
            required: "Yes"
            description: Annotation text - observation, suggestion, or edit note.
          - param: section
            type: string
            required: "No"
            description: "Target section heading (ex. 'Key Metrics')."
          - param: kind
            type: "'note' | 'edit'"
            required: "No"
            description: "'note' for observations, 'edit' for suggested changes."
          - param: replacement
            type: string
            required: "No"
            description: "For 'edit' kind: the replacement text."
      - type: markdown
        body: |
          **When to use:** When an agent spots something worth flagging - stale data, a correction, additional context. Annotations let agents contribute feedback without overwriting the page.

      - type: code
        language: text
        code: |
          > Annotate the Q2 roadmap page: the launch date in the timeline section should be June 15, not June 1
