title: Self-Hosting
subtitle: Run curata on your own infrastructure with Docker.
shell: standard
components:
  - type: markdown
    body: |
      Curata is open source and designed to run anywhere Docker runs. Self-hosting gives you full control over your data, network access, and auth configuration.

  - type: section
    heading: Prerequisites
    components:
      - type: markdown
        body: |
          - **Docker** (or a container runtime like Podman)
          - **PostgreSQL 15+** - curata stores pages, annotations, and org data in Postgres
          - A domain or internal hostname for your instance

  - type: section
    heading: Quick start with Docker
    components:
      - type: steps
        numbered: true
        items:
          - title: Clone the repository
            detail: ""
          - title: Set environment variables
            detail: ""
          - title: Run the container
            detail: ""

      - type: code
        language: bash
        code: |
          # 1. Clone
          git clone https://github.com/tdiderich/curata.git
          cd curata

          # 2. Set environment variables
          cp .env.example .env
          # Edit .env with your Postgres connection string and auth config

          # 3. Run with Docker Compose
          docker compose up -d

      - type: markdown
        body: |
          The app will be available at `http://localhost:3000`.

  - type: section
    heading: Environment variables
    components:
      - type: table
        filterable: false
        columns:
          - key: variable
            label: Variable
          - key: required
            label: Required
            align: center
          - key: description
            label: Description
        rows:
          - variable: DATABASE_URL
            required: "Yes"
            description: PostgreSQL connection string.
          - variable: AUTH_PROVIDER
            required: "No"
            description: "Auth provider - 'clerk' (default for hosted) or 'local' for self-hosted."
          - variable: NEXTAUTH_SECRET
            required: "Yes"
            description: Secret for session signing. Generate with openssl rand -base64 32.
          - variable: NEXTAUTH_URL
            required: "Yes"
            description: Full URL of your instance (ex. https://curata.internal.yourcompany.com).

      - type: callout
        variant: warn
        title: Hosted vs. self-hosted auth
        body: |
          The hosted version at curata.ai uses Clerk for authentication. The open-source version uses pluggable auth - you can use local credentials, OIDC, or any NextAuth provider. See the [OSS README](https://github.com/tdiderich/curata) for auth configuration.

  - type: section
    heading: Database setup
    components:
      - type: markdown
        body: |
          Curata uses Prisma for database management. After setting `DATABASE_URL`, run migrations:

      - type: code
        language: bash
        code: |
          # Inside the container or locally with Node.js
          npx prisma migrate deploy

      - type: markdown
        body: |
          This creates all required tables. Prisma migrations are idempotent - safe to run multiple times.

  - type: section
    heading: Connecting agents to self-hosted
    components:
      - type: markdown
        body: |
          Curata includes a built-in MCP server at `/api/mcp/stream` - no separate package needed. Point your MCP client at your instance URL:

      - type: tabs
        tabs:
          - label: No auth (AUTH_MODE=none)
            components:
              - type: markdown
                body: "When running with `AUTH_MODE=none`, omit the `headers` block entirely:"
              - type: code
                language: json
                code: |
                  {
                    "mcpServers": {
                      "curata": {
                        "type": "url",
                        "url": "http://localhost:3000/api/mcp/stream"
                      }
                    }
                  }
          - label: Custom domain
            components:
              - type: markdown
                body: "If your instance is behind a reverse proxy with auth enabled, include your API key:"
              - type: code
                language: json
                code: |
                  {
                    "mcpServers": {
                      "curata": {
                        "type": "url",
                        "url": "https://curata.internal.yourcompany.com/api/mcp/stream",
                        "headers": {
                          "Authorization": "Bearer ck_your_api_key_here"
                        }
                      }
                    }
                  }

      - type: markdown
        body: |
          The built-in MCP server works identically against hosted or self-hosted - the only difference is the URL.

  - type: section
    heading: Prisma v7 and standalone builds
    components:
      - type: markdown
        body: |
          Curata uses Prisma v7, which moved the datasource URL from `schema.prisma` to a TypeScript config file (`prisma.config.ts`). This has implications for standalone deployments (Next.js `output: "standalone"`):

          - The Prisma CLI needs Node.js module resolution to load `prisma.config.ts`
          - Next.js standalone output strips `node_modules`
          - pnpm symlinks don't survive `cp -r`

      - type: callout
        variant: warn
        title: Standalone deploy workaround
        body: |
          If you deploy using Next.js standalone output (not Docker), install Prisma globally on your deploy target and set `NODE_PATH` so the CLI can find its modules:

      - type: code
        language: bash
        code: |
          # On your deploy target (ex. EC2, bare metal)
          npm install -g prisma

          # Run migrations with NODE_PATH pointing to global modules
          cd /opt/curata
          NODE_PATH=/usr/lib/node_modules prisma db push

      - type: markdown
        body: |
          The Docker image handles this automatically - Prisma is available inside the container and the entrypoint runs `prisma db push` on startup. This workaround is only needed for non-Docker standalone deployments.

  - type: section
    heading: Production deployment
    components:
      - type: markdown
        body: |
          For production, we recommend:

          - **Railway, Render, or Fly.io** for one-click container hosting
          - **Managed Postgres** (Neon, Supabase, RDS) rather than running your own database
          - **HTTPS** via your platform's built-in TLS or a reverse proxy like Caddy/nginx
          - **Backups** - standard Postgres `pg_dump` on a schedule

      - type: callout
        variant: info
        title: Just want it hosted?
        body: |
          If you don't need to self-host, [curata.ai](https://curata.ai/sign-up) handles all of this for you - database, auth, TLS, backups, and updates. Free for solo use, $99/month for teams.
