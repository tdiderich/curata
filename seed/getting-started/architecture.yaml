title: Architecture
subtitle: How curata works under the hood - the knowledge loop, data model, and system design.
shell: standard
components:
  - type: markdown
    body: |
      Curata is a read-write knowledge store built around one idea: agent outputs should become agent inputs. This page explains how the system is designed and why.

  - type: section
    heading: The knowledge loop
    components:
      - type: markdown
        body: |
          Every interaction with curata follows a three-phase loop:

      - type: steps
        numbered: true
        items:
          - title: "Agents write"
            detail: "AI agents publish structured pages through the MCP server or HTTP API. Pages are stored as kazam YAML - a format designed for machines to produce and humans to read."
          - title: "Humans curate"
            detail: "Your team views rendered pages in the dashboard. They annotate directly on the content - corrections, context, approvals. Annotations are stored alongside the page."
          - title: "Agents read"
            detail: "Next session, agents search and read from the knowledge base. They start with real context (including human feedback) instead of guessing. The output quality improves."

      - type: markdown
        body: |
          This isn't a one-time workflow - it's a compounding loop. Each cycle adds signal. Pages get better over time as agents and humans iterate on the same content.

  - type: section
    heading: System components
    components:
      - type: card_grid
        min_width: 280
        cards:
          - title: MCP server
            badge:
              label: npm
              color: teal
            description: "Stdio server that bridges MCP-compatible agents to the curata API. Installed globally via npm. Exposes 6 tools: search, read, list, write, create, annotate."
          - title: Web application
            badge:
              label: Next.js
              color: teal
            description: "Dashboard for viewing, editing, and annotating pages. Includes org management, API key generation, and public sharing. Built with Next.js + Prisma."
          - title: kazam renderer
            badge:
              label: Rust → WASM
              color: teal
            description: "Renders kazam YAML into themed HTML. Runs as a Rust CLI for static sites and as a generated React component in the web app. 40+ component types."
          - title: API layer
            description: "REST endpoints that the MCP server calls. Handles auth (API key or session), page CRUD, search, and annotations. All behind /api/agent/*."
          - title: PostgreSQL
            description: "Stores pages (YAML content + metadata), annotations, orgs, users, and API keys. Prisma ORM with typed queries."

  - type: section
    heading: Data model
    components:
      - type: markdown
        body: |
          The core data model is intentionally simple:

      - type: code
        language: text
        code: |
          Org
           ├── Users (members of the org)
           ├── ApiKeys (for agent access)
           └── Pages
                ├── slug (unique within org)
                ├── json (kazam YAML stored as JSON)
                ├── contentHash (for optimistic concurrency)
                ├── visibility (org | shared | public)
                └── Annotations
                     ├── text
                     ├── section (optional target)
                     ├── kind (note | edit)
                     └── author

      - type: markdown
        body: |
          Pages are stored as JSON (parsed from kazam YAML). The renderer reads the JSON and produces HTML at render time - no pre-compilation step.

  - type: section
    heading: kazam format
    components:
      - type: markdown
        body: |
          Pages use the [kazam](https://github.com/tdiderich/kazam) YAML format. kazam is an open-source Rust CLI that also generates static sites from the same format. Curata uses kazam's React renderer to display pages dynamically.

          The format is designed for LLM authoring:
          - **Consistent `type:` tags** - no nested conditionals or template logic
          - **40+ component types** - from `markdown` and `code` to `stat_grid`, `timeline`, `tabs`, and `accordion`
          - **3 shells** - standard (dashboard), document (print-ready), deck (slides)

          See [Page Structure](/pages/page-structure) for the full component reference.

  - type: section
    heading: API endpoints
    components:
      - type: markdown
        body: |
          The agent API lives at `/api/agent/*`. All endpoints accept either an API key (`Authorization: Bearer <key>`) or a session cookie.

      - type: table
        filterable: false
        columns:
          - key: method
            label: Method
            align: center
          - key: endpoint
            label: Endpoint
          - key: description
            label: Description
        rows:
          - method: GET
            endpoint: /api/agent/search
            description: Search pages by keyword. Returns matching titles and snippets.
          - method: GET
            endpoint: /api/agent/read_page
            description: Read a page by slug. Returns full content + annotations.
          - method: GET
            endpoint: /api/agent/list_pages
            description: List all pages in the org.
          - method: POST
            endpoint: /api/agent/write_page
            description: Create or update a page (upsert).
          - method: POST
            endpoint: /api/agent/create_page
            description: Create a page. Fails if slug exists.
          - method: POST
            endpoint: /api/agent/annotate_page
            description: Add an annotation to a page.

  - type: section
    heading: Why kazam YAML?
    components:
      - type: markdown
        body: |
          We chose kazam YAML over Markdown, HTML, or JSON for a few reasons:

          - **Structured by default.** Markdown is freeform - an LLM can produce wildly different layouts for the same prompt. Kazam's component types give agents a vocabulary: "use `stat_grid` for metrics, `callout` for key takeaways, `steps` for instructions."
          - **Renderable.** The same YAML renders identically as a static site (via `kazam build`) and in the curata dashboard. No separate template layer.
          - **Machine-readable.** Because components are typed, search, extraction, and cross-referencing work on structure, not regex.
          - **Human-editable.** YAML is familiar and readable. Your team can hand-edit pages when they want to.
