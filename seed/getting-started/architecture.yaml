title: Architecture
subtitle: The knowledge loop - how agents write, humans validate, and everything learned flows back to the whole team.
shell: standard
components:
  - type: markdown
    body: |
      Curata is a company brain. Agents feed it from real work, policy shapes what gets in, humans validate what matters, and every agent and every human starts their next session from what the team already learned. This page explains the pieces that make that loop compound instead of resetting.

  - type: section
    heading: The knowledge loop
    components:
      - type: steps
        numbered: true
        items:
          - title: "Agents write"
            detail: "Agents publish structured pages through the built-in MCP server. Every write passes through org rules at the write path: required sections, blocked content, approval requirements. A blocked write returns a teaching error that cites the rule, so the agent fixes the call instead of guessing."
          - title: "Humans validate"
            detail: "Your team reads rendered pages, annotates directly on the content, and approves where it counts. Pages under an approval rule queue for review; everything else just publishes. Validation effort goes where you point it, never everywhere by default."
          - title: "Agents read back"
            detail: "Next session, any agent searches the brain and starts from validated answers instead of guessing. Approved pages outrank general knowledge. Human corrections ride along as annotations."
          - title: "The loop reports on itself"
            detail: "The weekly digest tells humans what the brain learned: the one big thing, a few noteworthy pages, and activity stats. Humans steer, agents keep writing."

      - type: markdown
        body: |
          The flywheel piece is capture. When an agent answers a question well in a working session, `capture_thread` checks the answer against pages that already exist, then turns the validated answer into a page. The next agent starts from it. Each cycle adds signal instead of starting over.

  - type: section
    heading: The trust layer
    components:
      - type: markdown
        body: |
          Every page has two channels: **latest** (every edit, immediately) and **trusted** (a version a human approved). Trust is optional provenance, never a lifecycle requirement. Most pages are fine living on latest forever.

          Where correctness matters (customer-facing answers, pricing, security posture), you attach an approval rule to the folder or page. Those pages queue for review, named approvers sign off, and agents reading the trusted channel get the approved version even while newer edits pile up behind it. One approval on a shared component fans out to every page that embeds it.

  - type: section
    heading: Shared components
    components:
      - type: markdown
        body: |
          Facts that appear in many places (pricing, team roster, SLA terms) live once as a component page and get embedded by reference:

      - type: code
        language: yaml
        code: |
          - type: ref
            component: pricing-snapshot

      - type: markdown
        body: |
          Edit the component, every page that embeds it updates. Approve it once, the approved version renders everywhere. Access is re-checked at read time, so an embed never leaks a page the viewer can't see.

  - type: section
    heading: System components
    components:
      - type: card_grid
        min_width: 280
        cards:
          - title: Web application
            badge:
              label: Next.js
              color: teal
            description: "Dashboard for reading, editing, annotating, and reviewing pages. Folders, org rules, the review queue, and public sharing all live here."
          - title: Built-in MCP server
            description: "Lives at /api/mcp/stream, nothing to install. 43 tools covering search, reads, writes, capture, trust, templates, and the digest. OAuth for interactive agents, API keys for headless ones."
          - title: PostgreSQL
            badge:
              label: Prisma
              color: teal
            description: "Stores pages with full version history, trust pointers, annotations, concept tags, folders, rules, and the audit log."
          - title: kazam renderer
            description: "Typed YAML in, themed HTML out. Runs as a generated React component in the app and as a Rust CLI for static export. 40+ component types."

  - type: section
    heading: Data model
    components:
      - type: code
        language: text
        code: |
          Org
           ├── Folders (org rules cascade here; locked folders hold curata-managed scaffolding)
           └── Pages
                ├── slug (unique within org)
                ├── versions[] (full history, every write)
                ├── trustedVersionId (which version a human approved, if any)
                ├── visibility (org | shared | public)
                ├── concepts (tags that power grouping, search, and the semantic map)
                └── annotations (human notes, corrections, approvals-in-context)

      - type: markdown
        body: |
          Versions are the unit of trust: latest is simply the newest version, trusted is a pointer a human moves on purpose. Nothing is ever edited in place, so review always has a real diff to look at.

  - type: section
    heading: Why typed pages
    components:
      - type: markdown
        body: |
          Pages are [kazam](https://github.com/tdiderich/kazam) YAML: a component vocabulary designed for agents to produce and humans to read.

          - **Structured by default.** Markdown is freeform, so two agents produce two layouts for the same prompt. Typed components give agents a vocabulary: `stat_grid` for metrics, `callout` for the key takeaway, `steps` for instructions.
          - **Validatable.** Because components are typed, org rules can require sections, block content patterns, and reject malformed pages at write time instead of after publication.
          - **Machine-readable.** Search, related-page detection, and the semantic map work on structure, never regex.
          - **Human-editable.** YAML reads fine in a code review and renders the same in the dashboard, on public pages, and in static exports.

          See [Page Structure](/pages/page-structure) for the full component reference.
