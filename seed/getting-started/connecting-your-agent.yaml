title: Connecting Your Agent
subtitle: Point any MCP client at curata. OAuth for interactive agents, API keys for headless ones.
shell: standard
components:
  - type: markdown
    body: |
      Curata includes a built-in MCP server at `/api/mcp/stream`. There is nothing to install and, for most clients, no key to manage: paste the URL, sign in when your client asks, done. The server advertises its auth via standard MCP discovery, so OAuth-capable clients set themselves up.

  - type: section
    heading: "Connect with OAuth (recommended)"
    components:
      - type: tabs
        tabs:
          - label: Claude (claude.ai)
            components:
              - type: steps
                numbered: true
                items:
                  - title: Add the connector
                    detail: "Go to **Settings → Connectors → Add custom connector** and paste `https://curata.ai/api/mcp/stream`."
                  - title: Sign in
                    detail: "Claude opens a browser window to authorize. Sign in with your curata account and approve."
                  - title: Done
                    detail: "The curata tools show up in every conversation. Ask Claude to list pages to confirm."
          - label: Claude Code
            components:
              - type: markdown
                body: "One command, then authenticate from inside the session:"
              - type: code
                language: bash
                code: |
                  claude mcp add --transport http curata https://curata.ai/api/mcp/stream
              - type: markdown
                body: "Start a session and run `/mcp` to complete the browser sign-in. No key in your config, nothing to rotate."
          - label: Cursor
            components:
              - type: markdown
                body: "Add to `.cursor/mcp.json` in your project root (or `~/.cursor/mcp.json` for global):"
              - type: code
                language: json
                code: |
                  {
                    "mcpServers": {
                      "curata": {
                        "url": "https://curata.ai/api/mcp/stream"
                      }
                    }
                  }
              - type: markdown
                body: "Cursor handles the OAuth flow automatically. You'll see a browser sign-in prompt on first use."
          - label: GitHub Copilot
            components:
              - type: markdown
                body: "Add to `.vscode/mcp.json` in your project root:"
              - type: code
                language: json
                code: |
                  {
                    "servers": {
                      "curata": {
                        "type": "http",
                        "url": "https://curata.ai/api/mcp/stream"
                      }
                    }
                  }
              - type: markdown
                body: "Note: Copilot uses `servers` (not `mcpServers`) and `type: http`. The OAuth flow runs in your browser on first tool call."
          - label: Other clients
            components:
              - type: markdown
                body: |
                  Any client that supports MCP OAuth needs only the URL:

                  ```
                  https://curata.ai/api/mcp/stream
                  ```

                  The client discovers the authorization server through the standard well-known metadata and walks you through sign-in. If your client asks for manual OAuth configuration, it will find everything it needs at `/.well-known/oauth-protected-resource`.

  - type: section
    heading: "API keys (headless and CI)"
    components:
      - type: markdown
        body: |
          Use an API key when there is no browser to sign in with: cron jobs, CI pipelines, server-side agents, or a client without OAuth support. Create one at **Settings → API Keys**. Keys start with `ck_` and act with your permissions.

          Store the key in a `.env` file, never in config files under version control:

          ```
          CURATA_API_KEY=ck_your_key_here
          ```

      - type: tabs
        tabs:
          - label: Claude Code
            components:
              - type: markdown
                body: "Add to `.mcp.json` in your project root (or `~/.claude.json` for global):"
              - type: code
                language: json
                code: |
                  {
                    "mcpServers": {
                      "curata": {
                        "type": "url",
                        "url": "https://curata.ai/api/mcp/stream",
                        "headers": {
                          "Authorization": "Bearer ${CURATA_API_KEY}"
                        }
                      }
                    }
                  }
          - label: Cursor
            components:
              - type: markdown
                body: "Add to `.cursor/mcp.json` in your project root:"
              - type: code
                language: json
                code: |
                  {
                    "mcpServers": {
                      "curata": {
                        "url": "https://curata.ai/api/mcp/stream",
                        "headers": {
                          "Authorization": "Bearer ${CURATA_API_KEY}"
                        }
                      }
                    }
                  }
          - label: GitHub Copilot
            components:
              - type: markdown
                body: "Add to `.vscode/mcp.json` in your project root:"
              - type: code
                language: json
                code: |
                  {
                    "servers": {
                      "curata": {
                        "type": "http",
                        "url": "https://curata.ai/api/mcp/stream",
                        "headers": {
                          "Authorization": "Bearer ${CURATA_API_KEY}"
                        }
                      }
                    }
                  }
          - label: OpenAI Codex
            components:
              - type: markdown
                body: "Add to `.codex/config.toml` in your project root (or `~/.codex/config.toml` for global):"
              - type: code
                language: toml
                code: |
                  [mcp_servers.curata]
                  url = "https://curata.ai/api/mcp/stream"
                  bearer_token_env_var = "CURATA_API_KEY"
              - type: markdown
                body: "Codex reads the key from your environment. Make sure `CURATA_API_KEY` is set in your shell or `.env`."
          - label: Gemini CLI
            components:
              - type: markdown
                body: "Add to `~/.gemini/settings.json` (or `.gemini/settings.json` in your repo):"
              - type: code
                language: json
                code: |
                  {
                    "mcpServers": {
                      "curata": {
                        "httpUrl": "https://curata.ai/api/mcp/stream",
                        "headers": {
                          "Authorization": "Bearer ${CURATA_API_KEY}"
                        }
                      }
                    }
                  }
          - label: Windsurf
            components:
              - type: markdown
                body: "Add to `~/.codeium/windsurf/mcp_config.json` (user-level only, no repo-level support):"
              - type: code
                language: json
                code: |
                  {
                    "mcpServers": {
                      "curata": {
                        "serverUrl": "https://curata.ai/api/mcp/stream"
                      }
                    }
                  }
              - type: markdown
                body: "Windsurf doesn't support OAuth or header auth natively for remote MCP. Use `npx mcp-remote` as a stdio wrapper if you need authenticated access, or connect on a self-hosted instance with `AUTH_MODE=none`."
          - label: Cline
            components:
              - type: markdown
                body: "Cline stores MCP config at the VS Code extension level. Open the Cline MCP settings and add:"
              - type: code
                language: json
                code: |
                  {
                    "mcpServers": {
                      "curata": {
                        "url": "https://curata.ai/api/mcp/stream"
                      }
                    }
                  }
              - type: markdown
                body: "For authenticated access, use `npx mcp-remote https://curata.ai/api/mcp/stream` as a stdio command, which handles the OAuth dance for clients that don't support it natively."
          - label: Any MCP client
            components:
              - type: markdown
                body: "The pattern is the same everywhere: streamable HTTP transport, the `/api/mcp/stream` URL, and an `Authorization: Bearer ck_...` header. Store the key in your environment, not in the config file."

      - type: callout
        variant: warn
        title: Treat keys like passwords
        body: |
          Keys inherit your access. Keep them out of version control, rotate them from **Settings → API Keys** if one leaks, and prefer OAuth anywhere a browser exists.

  - type: section
    heading: Self-hosted instances
    components:
      - type: markdown
        body: |
          Auth on a self-hosted instance follows its `AUTH_MODE`: `none` and `tailscale` deployments need no key at all (connect with just the URL on the trusted network), and API keys work in every mode. The [OSS README](https://github.com/tdiderich/curata) covers configuration.

  - type: section
    heading: Verify the connection
    components:
      - type: markdown
        body: |
          Ask your agent to list pages. A result (or an empty list on a fresh workspace) means you are connected. From there, try `search` before answering org-specific questions and `capture_thread` when an answer is worth keeping. The server's own instructions teach connected agents the rest.
