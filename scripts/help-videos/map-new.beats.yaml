# New map item help video (public/help/map-new.mp4). Screens: src/stories/demo/map.stories.tsx.
title: Add to the map
size: [1440, 900]
target_seconds: 28
beats:
  - id: form
    story: demo-map--new
    caption: "Add anything others depend on: pricing, a policy, a template."
    seconds: 5

  - id: name
    story: demo-map--new
    steps: [{ css: "#nn-title" }, { type: "Data retention" }]
    ring: { css: "#nn-title" }
    caption: Name it the way people will see it on the map.
    seconds: 4.5

  - id: source
    story: demo-map--new
    steps:
      - { css: "#nn-title" }
      - { type: "Data retention" }
      - { css: "input[placeholder='Search pages']" }
      - { type: "retention" }
    ring: { css: ".nmf-step:nth-child(2)" }
    caption: Point at the page that owns the truth for it.
    seconds: 5

  - id: related
    story: demo-map--new
    steps:
      - { css: "#nn-title" }
      - { type: "Data retention" }
      - { css: "input[placeholder='Search pages']" }
      - { type: "retention" }
      - { css: ".nn-hit" }
      - { css: "input[placeholder='Search pages, or paste a URL']" }
      - { type: "privacy" }
      - { css: ".nn-hit" }
      - { css: "input[placeholder='Search pages, or paste a URL']" }
      - { type: "self-host" }
      - { css: ".nn-hit" }
    ring: { css: ".nn-related" }
    caption: Then list the pages that depend on it.
    seconds: 5.5

  - id: create
    story: demo-map--new
    steps:
      - { css: "#nn-title" }
      - { type: "Data retention" }
      - { css: "input[placeholder='Search pages']" }
      - { type: "retention" }
      - { css: ".nn-hit" }
      - { css: "input[placeholder='Search pages, or paste a URL']" }
      - { type: "privacy" }
      - { css: ".nn-hit" }
      - { css: "input[placeholder='Search pages, or paste a URL']" }
      - { type: "self-host" }
      - { css: ".nn-hit" }
    ring: { css: ".nmf-footer" }
    caption: Create it. When the source changes, those pages turn yellow.
    seconds: 5.5

  - id: end
    card:
      title: Or have your agent map your key pages
      note: The prompt is one click away, right below this video.
    seconds: 4
