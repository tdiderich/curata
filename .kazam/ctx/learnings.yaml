learnings:
- id: kz-1ba3
  text: Next dev server holds a stale Prisma client after schema changes — prisma db push + generate is not enough, the dev process must be restarted or API routes 500 with PrismaClientValidationError on new columns
  category: correction
  created: 2026-06-09T15:46:29.507123-05:00
- id: kz-a991
  text: An Edit that inserted a template literal wrote a literal NUL byte where a space was intended, which made git report src/lib/concepts.ts as 'Bin' in diff --stat and file(1) call it 'data'. Check 'git diff --stat' for Bin on a text file after edits, then grep for NUL before committing.
  category: correction
  created: 2026-07-28T21:58:14.940709-05:00
- id: kz-ab14a2
  text: curata-app/.env is a stale local copy - it carries the Railway PRODUCTION DATABASE_URL (quoted, greps miss it) but only dev pk_test Clerk keys; the real prod Clerk PROD-tenant keys are set as Railway env vars (Tyler 2026-08-12), so never infer prod config from this file. Never blanket-source curata-app/.env for local test servers; export DATABASE_URL explicitly.
  category: correction
  created: 2026-08-12T10:26:48.535484-05:00
- id: kz-8848f2
  text: kazam.css is fully regenerated by 'pnpm generate' (.bin/kazam theme css --switchable > src/app/kazam.css) — never hand-edit tokens there, put app-owned CSS custom properties in globals.css instead
  category: correction
  created: 2026-08-13T14:32:51.700941-05:00
- id: kz-aaaa87
  text: restore_page_version was bypassing the write choke point (_writePageInternal) by creating a PageVersion directly — any new write path for pages must route through writePage/writePageJson/restorePageVersion in src/lib/pages.ts, never db.pageVersion.create directly, or it silently skips tokenCount restamping, the brain-cap check, and inline version pruning
  category: correction
  created: 2026-08-15T12:14:22.895929-05:00
- id: kz-2df32e
  text: 'claude.ai MCP connector caches tool schemas: curata-cloud connector served pre-batch-2 schemas (no capture_token/dedup_ack on create_page, no capture_thread visible to subagent ToolSearch) a day after deploy while raw tools/list on the same server was current. Dogfood agents using the connector see stale surface; raw curl agents see truth. Refresh connector in claude.ai settings after MCP surface changes'
  category: correction
  created: 2026-08-15T18:13:53.695672-05:00
